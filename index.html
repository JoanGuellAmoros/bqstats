<!DOCTYPE html>
<html lang="ca" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <title>Basquet Stats</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="px-3 py-2 d-flex align-items-center gap-2 border-bottom border-secondary">
      <button id="btnBack" class="btn btn-sm btn-outline-light" onclick="navigateBack()" style="display:none">&larr;</button>
      <h1 id="appTitle" class="fs-5 fw-bold mb-0 flex-grow-1">Basquet Stats</h1>
      <button id="btnAddPlayerTop" class="btn btn-sm btn-outline-success" onclick="openAddPlayerPopup()" style="display:none" title="Afegir jugador" aria-label="Afegir jugador">&#10133;</button>
    </header>

    <main id="mainContent" class="container-fluid px-2 py-2">

      <!-- HOME -->
      <section id="viewHome" class="view active">
        <div id="homeGrid" class="row g-2">
          <div class="col-6"><button class="btn btn-outline-light w-100 py-4 fs-5" onclick="navigateTo('viewPlayers')">&#128101;<br><small>Jugadors</small></button></div>
          <div class="col-6"><button class="btn btn-outline-light w-100 py-4 fs-5" onclick="navigateTo('viewNewGame')">&#127936;<br><small>Nou Partit</small></button></div>
          <div class="col-6"><button class="btn btn-outline-light w-100 py-4 fs-5" onclick="navigateTo('viewHistory')">&#128214;<br><small>Historial</small></button></div>
          <div class="col-6"><button class="btn btn-outline-light w-100 py-4 fs-5" onclick="navigateTo('viewStats')">&#128200;<br><small>Estadistiques</small></button></div>
        </div>
      </section>

      <!-- PLAYERS -->
      <section id="viewPlayers" class="view">
        <div class="input-group mb-1" id="playerAddBox">
          <input type="text" id="playerName" class="form-control" placeholder="Nom del jugador">
          <input type="number" id="playerNumber" class="form-control" placeholder="Num." min="0" max="99" style="max-width:70px">
          <select id="playerTeam" class="form-select" style="max-width:120px"></select>
          <button class="btn btn-primary" id="btnPlayerSave" onclick="addPlayer()">Afegir</button>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <label class="small text-secondary mb-0 text-nowrap">Filtrar per equip:</label>
          <select id="playerTeamFilter" class="form-select form-select-sm flex-grow-1" onchange="renderPlayers()"></select>
        </div>
        <div class="d-flex gap-2 align-items-center mb-2" id="bulkBar" style="display:none">
          <span id="bulkCount" class="small text-secondary text-nowrap">0 seleccionats</span>
          <select id="bulkTeamSelect" class="form-select form-select-sm flex-grow-1"></select>
          <button class="btn btn-sm btn-primary text-nowrap" onclick="applyBulkTeam()">Canviar equip</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="clearPlayersSelection()" title="Cancel·lar selecció">&#10005;</button>
        </div>
        <ul id="playerList" class="list-group list-group-flush"></ul>
      </section>

      <!-- TEAMS -->
      <section id="viewTeams" class="view">
        <div class="input-group mb-2">
          <input type="text" id="teamName" class="form-control" placeholder="Nom de l'equip">
          <button class="btn btn-primary" onclick="addTeam()">Afegir</button>
        </div>
        <ul id="teamList" class="list-group list-group-flush"></ul>
      </section>

      <!-- NEW GAME -->
      <section id="viewNewGame" class="view">
        <div class="card border-secondary">
          <div class="card-body">
            <label class="form-label small text-secondary">Equip Local / Visitant:</label>
            <div class="btn-group mb-3 w-100" role="group">
              <input type="radio" class="btn-check" name="gameSide" value="local" id="sideLocal" checked onchange="toggleGameSide()">
              <label class="btn btn-outline-primary" for="sideLocal">Local</label>
              <input type="radio" class="btn-check" name="gameSide" value="visitor" id="sideVisitor" onchange="toggleGameSide()">
              <label class="btn btn-outline-primary" for="sideVisitor">Visitant</label>
            </div>
            <label class="form-label small text-secondary">Equip:</label>
            <select id="gameTeamSelect" class="form-select mb-2" onchange="onGameTeamChange()"></select>
            <label class="form-label small text-secondary">Rival:</label>
            <input type="text" id="gameOpponent" class="form-control mb-2" placeholder="Nom del rival">
            <label class="form-label small text-secondary">Quarts:</label>
            <select id="gamePeriods" class="form-select mb-2">
              <option value="4">4 quarts</option>
              <option value="2">2 parts</option>
            </select>
            <label class="form-label small text-secondary">Tipus de partit:</label>
            <select id="gameType" class="form-select mb-2">
              <option value="NBA">NBA</option>
              <option value="Lliga Catalana">Lliga Catalana</option>
              <option value="ACB">ACB</option>
              <option value="Eurolliga">Eurolliga</option>
              <option value="Amistós">Amistós</option>
            </select>
            <label class="form-label small text-secondary">Data:</label>
            <input type="date" id="gameDate" class="form-control mb-3">
            <label class="form-label small text-secondary">Selecciona jugadors:</label>
            <div id="playerSelectList" class="mb-3"></div>
            <button class="btn btn-primary w-100 btn-lg" onclick="startGame()">Començar Partit</button>
          </div>
        </div>
      </section>

      <!-- LIVE GAME -->
      <section id="viewLiveGame" class="view">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2 p-2 border border-secondary rounded">
          <span id="liveScore" class="fw-bold fs-5 flex-grow-1"></span>
          <span id="livePeriod" class="small text-secondary"></span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-danger" onclick="addRivalStat(1)">+1</button>
            <button class="btn btn-outline-danger" onclick="addRivalStat(2)">+2</button>
            <button class="btn btn-outline-danger" onclick="addRivalStat(3)">+3</button>
          </div>
          <button class="btn btn-sm btn-outline-secondary" onclick="prevPeriod()">&#8592; Quart</button>
          <button class="btn btn-sm btn-outline-info" onclick="nextPeriod()">Següent Quart &#8594;</button>
        </div>
        <div class="live-tabs mb-2 d-flex gap-1 flex-wrap" id="liveTabs"></div>
        <div class="live-controls mb-2" id="liveControls">
          <div class="d-flex gap-2 align-items-center mb-2">
            <button class="btn btn-sm btn-outline-warning flex-grow-1" id="btnSubstitute" onclick="openSubstitution()">&#8646; Canvi</button>
          </div>
          <div class="mb-1 d-flex flex-wrap gap-1 justify-content-center" id="statButtons">
            <button class="btn btn-outline-success stat-btn" onclick="addStat('twoMade')">2P+</button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('twoMissed')">2P-</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('threeMade')">3P+</button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('threeMissed')">3P-</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('ftMade')">TL+</button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('ftMissed')">TL-</button>
          </div>
          <div class="mb-1 d-flex flex-wrap gap-1 justify-content-center">
            <button class="btn btn-outline-success stat-btn" onclick="addStat('oReb')">RO</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('dReb')">RD</button>
          </div>
          <div class="mb-1 d-flex flex-wrap gap-1 justify-content-center">
            <button class="btn btn-outline-success stat-btn" onclick="addStat('assists')">AST</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('steals')">REC</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('blocks')">TAP</button>
            <button class="btn btn-outline-success stat-btn" onclick="addStat('foulsReceived')">FALTR</button>
          </div>
          <div class="mb-2 d-flex flex-wrap gap-1 justify-content-center">
            <button class="btn stat-btn" style="visibility:hidden" tabindex="-1"></button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('turnovers')">PERD</button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('blocksAgainst')">TAPR</button>
            <button class="btn btn-outline-danger stat-btn" onclick="addStat('pFouls')">FALT</button>
          </div>
          <div class="d-flex gap-2 align-items-center justify-content-center flex-wrap">
            <button class="btn btn-sm btn-outline-secondary live-toggle-btn" id="btnUndo" onclick="undoLastAction()" disabled>&#8630; Desfer</button>
            <button class="btn btn-sm btn-outline-secondary live-toggle-btn" id="btnToggleStats" onclick="toggleStats()">&#128200; Amagar</button>
            <button class="btn btn-sm btn-secondary live-toggle-btn" id="btnToggleLog" onclick="toggleActionLog()">&#128220; Mostrar</button>
          </div>
        </div>
        <div class="stats-scroll">
          <div class="live-stats mb-2" id="liveStats"></div>
        </div>
        <div class="live-action-log border border-secondary rounded p-2 mb-2" id="liveActionLog" style="display:none;max-height:300px;overflow-y:auto"></div>
        <div class="d-flex gap-2 flex-wrap" id="liveActions"></div>
      </section>

      <!-- HISTORY -->
      <section id="viewHistory" class="view">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="gameSelectAll" onchange="toggleSelectAllGames()">
            <label class="form-check-label small text-secondary text-nowrap" for="gameSelectAll">Tots</label>
          </div>
          <button class="btn btn-sm btn-outline-primary" onclick="exportGames()">&#11123; Exportar seleccionats</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="importGames()">&#10515; Importar partits</button>
          <input type="file" id="gameImportFile" accept=".json" style="display:none" onchange="handleGamesImport(event)">
          <button class="btn btn-sm btn-outline-danger" onclick="cleanupDuplicateGames()">Netejar duplicats</button>
        </div>
        <ul id="gameList" class="list-group list-group-flush"></ul>
      </section>

      <!-- GAME DETAIL -->
      <section id="viewGameDetail" class="view">
        <div id="detailHeader"></div>
        <div id="detailMetaEdit" class="mb-2"></div>
        <ul class="nav nav-pills nav-fill gap-1 mb-3">
          <li class="nav-item"><button class="nav-link active" id="dtabStats" onclick="switchDetailTab('stats')">Resum / Estadistiques</button></li>
          <li class="nav-item"><button class="nav-link" id="dtabPlays" onclick="switchDetailTab('plays')">Jugades</button></li>
        </ul>
        <div id="detailStats"></div>
        <div id="detailPlays" style="display:none"></div>
        <div id="detailActions" class="d-flex gap-2 flex-wrap mt-3"></div>
      </section>

      <!-- GLOBAL STATS -->
      <section id="viewStats" class="view">
        <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary active" id="tabTotals" onclick="switchStatsTab('totals')">Totals</button>
            <button class="btn btn-outline-primary" id="tabAverages" onclick="switchStatsTab('averages')">Mitjanes</button>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <label class="small text-secondary mb-0 text-nowrap">Equip:</label>
          <select id="statsTeamFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderGlobalStats()"></select>
          <label class="small text-secondary mb-0 text-nowrap">Competició:</label>
          <select id="statsTypeFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderGlobalStats()"></select>
          <label class="small text-secondary mb-0 text-nowrap" title="Temporada">Temp.:</label>
          <select id="statsSeasonFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderGlobalStats()"></select>
        </div>
        <div id="globalStats"></div>
      </section>

      <!-- RECORDS -->
      <section id="viewRecords" class="view">
        <div class="d-flex align-items-center gap-2 mb-2">
          <label class="small text-secondary mb-0 text-nowrap">Equip:</label>
          <select id="recordsTeamFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderRecords()"></select>
          <label class="small text-secondary mb-0 text-nowrap">Competició:</label>
          <select id="recordsTypeFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderRecords()"></select>
          <label class="small text-secondary mb-0 text-nowrap" title="Temporada">Temp.:</label>
          <select id="recordsSeasonFilter" class="form-select form-select-sm" style="flex:1;min-width:0" onchange="renderRecords()"></select>
        </div>
        <div class="btn-group btn-group-sm d-flex mb-2">
          <button class="btn btn-outline-primary active" id="tabRecordsGame" onclick="switchRecordsMode('game')">Partit</button>
          <button class="btn btn-outline-primary" id="tabRecordsQuarter" onclick="switchRecordsMode('quarter')">Quart</button>
        </div>
        <div class="btn-group btn-group-sm d-flex mb-2">
          <button class="btn btn-outline-success active" id="tabRecordsPlayer" onclick="switchRecordsGroup('player')">Jugador</button>
          <button class="btn btn-outline-success" id="tabRecordsTeam" onclick="switchRecordsGroup('team')">Equip</button>
        </div>
        <div id="recordsQuarters" style="display:none"></div>
        <div id="recordsList"></div>
      </section>

    </main>

  </div>

  <!-- POPUP OVERLAY -->
  <div id="popupOverlay" class="popup-overlay" style="display:none">
    <div class="popup-card">
      <div class="popup-header">
        <span id="popupTitle" class="popup-title"></span>
        <button class="btn btn-sm btn-close btn-close-white" onclick="closePopup()"></button>
      </div>
      <div id="popupBody" class="popup-body"></div>
      <div id="popupFooter" class="popup-footer d-flex gap-2 justify-content-end"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="db.js"></script>
  <script src="app.js?v=30"></script>
  <script>
    try {
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js');
      }
    } catch(e) { console.warn('SW registration skipped:', e.message); }
  </script>
</body>
</html>
